spring.application.name=lru-cache-service

server.port = 9090

# using postgres db as it is a robust and highly scalable and open source database
spring.datasource.url=jdbc:postgresql://localhost:5432/lru_cache
spring.datasource.username=postgres
spring.datasource.password=admin

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

lru.cache.capacity=5